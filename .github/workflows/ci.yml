name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server
        run: make -j4
      - name: Run unit tests
        run: make test
      - name: Check the JavaScript parses
        run: for f in $(find frontend/js -name '*.js'); do node --check "$f"; done
