<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartRailway</title>
  <meta name="description" content="Train, station and route management built on hand-written C++ data structures.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1f36'/%3E%3Cpath d='M8 22h16M10 10h12v8H10z' stroke='%23f4b400' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <nav class="rail" aria-label="Main">
      <a class="brand" href="#/overview" aria-label="SmartRailway home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">SmartRailway</span>
      </a>
      <ol class="stops" id="nav"></ol>
      <div class="rail-foot">
        <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting</span></div>
        <p class="rail-note">Train &amp; Route module</p>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <section class="console collapsed" id="console" aria-label="Data structure console">
    <button class="console-bar" id="console-toggle" aria-expanded="false" aria-controls="console-body">
      <span class="console-title">Data structure console</span>
      <span class="console-hint" id="console-hint">What the C++ data structures did for your last action</span>
      <span class="console-count" id="console-count">0</span>
    </button>
    <div class="console-body" id="console-body">
      <div class="console-tools"><button class="btn ghost small" id="console-clear" type="button">Clear</button></div>
      <div class="console-log" id="console-log" role="log"></div>
    </div>
  </section>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
